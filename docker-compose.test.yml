services:
  postgres-test:
    image: postgres:18
    container_name: fourlines-postgres-test
    restart: unless-stopped

    environment:
      POSTGRES_USER: fourlines
      POSTGRES_PASSWORD: fourlines
      POSTGRES_DB: fourlines_test

    ports:
      - "5433:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fourlines -d fourlines_test"]
      interval: 2s
      timeout: 5s
      retries: 10